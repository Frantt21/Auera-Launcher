[package]
name = "auera-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Launcher de juegos offline para Windows y Linux"
license-file = "../LICENSE"

[lib]
name = "auera_tauri_lib"

[[bin]]
name = "auera"
path = "src/main.rs"

[features]
# Compila el frontend dentro del binario (ui/dist). Sin esta feature el binario
# de debug intenta cargar `devUrl` (Vite en localhost:1420) y la ventana queda vacía.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
gilrs = "0.11"
dirs = "6"
percent-encoding = "2"
tauri-plugin-dialog = "2.8.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
